apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: default
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        type: statefulset
        pod:
          hostNetwork: true
          nodeSelector:
            zigbee: "true"
        initContainers:
          init-hacs:
            image:
              repository: curlimages/curl
              tag: 8.11.1
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                DEST=/config/custom_components/hacs
                # GitHub "latest release" tag; strip any leading 'v' for safety
                LATEST="$(curl -fsSL --max-time 20 https://api.github.com/repos/hacs/integration/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)" || true
                LATEST="${LATEST#v}"
                LOCAL="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "${DEST}/manifest.json" 2>/dev/null || true)"
                if [ -z "${LATEST}" ]; then
                  if [ -n "${LOCAL}" ]; then
                    echo "Could not reach GitHub API; keeping installed HACS ${LOCAL}"
                    exit 0
                  fi
                  echo "Could not reach GitHub API and HACS is not installed; aborting" >&2
                  exit 1
                fi
                if [ -n "${LOCAL}" ] && [ "${LATEST}" = "${LOCAL}" ]; then
                  echo "HACS ${LOCAL} is the latest release, skipping"
                  exit 0
                fi
                echo "Upgrading HACS ${LOCAL:-not-installed} -> ${LATEST}"
                mkdir -p /config/custom_components
                rm -rf "${DEST}"
                apk add --no-cache unzip >/dev/null 2>&1 || true
                curl -fsSL "https://github.com/hacs/integration/releases/download/${LATEST}/hacs.zip" -o /tmp/hacs.zip
                unzip -o -q /tmp/hacs.zip -d "${DEST}"
                rm -f /tmp/hacs.zip
                echo "HACS ${LATEST} installed"
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant # {"$imagepolicy": "flux-system:homeassistant:name"}
              tag: 2026.9.1 # {"$imagepolicy": "flux-system:homeassistant:tag"}
            securityContext:
              privileged: true
            probes:
              # Readiness: Check if the web UI is up
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              # Liveness: Restart the pod if it hangs
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  failureThreshold: 5
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8123
    route:
      main:
        enabled: true
        hostnames:
          - "ha.trevorleibert.com"
        parentRefs:
          - name: internal
            sectionName: websecure
    persistence:
      config:
        enabled: true
        type: hostPath
        hostPath: /root/container-data/homeassistant
        advancedMounts:
          main:
            main:
              - path: /config
            init-hacs:
              - path: /config
      dbus:
        enabled: true
        type: hostPath
        hostPath: /run/dbus
        globalMounts:
          - path: /run/dbus
            readOnly: true
